services:
  roc-gtnh-frontend:
    build:
      context: ./website
    container_name: roc-gtnh-frontend
    # 如果开启https，请提供证书，将USE_HTTPS设置为true，将443端口映射到宿主机
    #volumes:
    #  - ./server.crt:/etc/nginx/etc/crt/server.crt
    #  - ./server.key:/etc/nginx/etc/crt/server.key
    ports:
      - "80:80"
      # - "443:443"
    restart: always

  roc-gtnh-backend:
    build:
      context: ./server
    container_name: roc-gtnh-backend
    env_file:
      - path: ./server/.env
        required: false
    ports:
      # 端口映射到宿主机，如果需要修改宿主机端口，请修改左侧端口
      - "8080:8080"
    restart: always
